services:
  - type: web
    name: auraplay
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: data-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auradb
          property: connectionString
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_HMAC_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        value: 61951094794-ice7e5fabt7indlo6clki10f7093hjiu.apps.googleusercontent.com
      - key: ALLOW_MOCK_GOOGLE_LOGIN
        value: "true"
      - key: NEXT_PUBLIC_ALLOW_MOCK_GOOGLE_LOGIN
        value: "true"

  - type: worker
    name: referral-worker
    env: python
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/referral_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auradb
          property: connectionString

databases:
  - name: auradb
