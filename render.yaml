services:
  - type: web
    name: auraplay
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: data-storage
      mountPath: /opt/render/project/src/data
      sizeGB: 1

  - type: worker
    name: referral-worker
    env: python
    buildCommand: pip install -r scripts/requirements.txt
    startCommand: python scripts/referral_worker.py
