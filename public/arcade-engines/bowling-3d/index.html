<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Strike 3D Cyber Bowling</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #090d16;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    .hud-title { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
    .hud-val { font-size: 24px; font-weight: 900; color: #f59e0b; font-family: monospace; }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .ctl-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border: none;
      color: #000;
      font-size: 16px;
      font-weight: 900;
      padding: 14px 32px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(245,158,11,0.4);
      cursor: pointer;
      user-select: none;
    }
    .ctl-btn:active { transform: scale(0.95); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Pins Knocked</div>
      <div class="hud-val"><span id="pins-down">0</span>/10</div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div class="hud-title">Frame Score</div>
      <div class="hud-val" id="score">0</div>
    </div>
  </div>

  <div id="controls">
    <button class="ctl-btn" id="roll-btn">🎳 ROLL BALL</button>
  </div>
</div>

<script>
  // ── THREE.JS 3D SCENE SETUP ──
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x090d16, 0.008);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 22);
  camera.lookAt(0, 1.5, -30);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // ── LIGHTING ──
  const ambient = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambient);

  const pinLight = new THREE.SpotLight(0xf59e0b, 3);
  pinLight.position.set(0, 15, -45);
  pinLight.target.position.set(0, 0, -48);
  pinLight.castShadow = true;
  scene.add(pinLight);
  scene.add(pinLight.target);

  // ── 3D BOWLING LANE ──
  const LANE_W = 7;
  const LANE_L = 70;

  // Wood Flooring
  const laneGeo = new THREE.BoxGeometry(LANE_W, 0.5, LANE_L);
  const laneMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.15, metalness: 0.1 });
  const lane = new THREE.Mesh(laneGeo, laneMat);
  lane.position.set(0, -0.25, -20);
  lane.receiveShadow = true;
  scene.add(lane);

  // Gutters
  const gutterMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
  const leftGutter = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, LANE_L), gutterMat);
  leftGutter.position.set(-LANE_W / 2 - 0.75, -0.3, -20);
  const rightGutter = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, LANE_L), gutterMat);
  rightGutter.position.set(LANE_W / 2 + 0.75, -0.3, -20);
  scene.add(leftGutter, rightGutter);

  // ── 10 3D PINS ──
  const pinGeo = new THREE.CylinderGeometry(0.3, 0.45, 1.8, 16);
  const pinMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
  const pins = [];

  const PIN_START_Z = -46;
  const PIN_SPACING_X = 1.1;
  const PIN_SPACING_Z = 1.3;

  const pinLayout = [
    [0],
    [-0.5, 0.5],
    [-1, 0, 1],
    [-1.5, -0.5, 0.5, 1.5]
  ];

  function spawnPins() {
    pins.forEach(p => scene.remove(p));
    pins.length = 0;

    pinLayout.forEach((row, rIdx) => {
      row.forEach(col => {
        const pin = new THREE.Mesh(pinGeo, pinMat);
        pin.position.set(col * PIN_SPACING_X, 0.9, PIN_START_Z - rIdx * PIN_SPACING_Z);
        pin.castShadow = true;
        pin.isDown = false;
        pin.vx = 0;
        pin.vz = 0;
        pin.vRot = 0;
        scene.add(pin);
        pins.push(pin);
      });
    });
  }

  spawnPins();

  // ── 3D BOWLING BALL ──
  const ballGeo = new THREE.SphereGeometry(0.7, 32, 32);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, metalness: 0.9, roughness: 0.1 });
  const ball = new THREE.Mesh(ballGeo, ballMat);
  ball.position.set(0, 0.7, 10);
  ball.castShadow = true;
  scene.add(ball);

  let ballVX = 0;
  let ballVZ = 0;
  let isRolling = false;
  let aimX = 0;

  // Aiming position
  window.addEventListener('pointermove', e => {
    if (!isRolling) {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      aimX = Math.max(-2.5, Math.min(2.5, x * 3));
      ball.position.x = aimX;
    }
  });

  const rollBtn = document.getElementById('roll-btn');
  rollBtn.addEventListener('click', () => {
    if (!isRolling) {
      isRolling = true;
      ballVZ = -1.8;
      ballVX = (Math.random() - 0.5) * 0.08;
    }
  });

  const pinsDownEl = document.getElementById('pins-down');
  const scoreEl = document.getElementById('score');

  // ── GAME LOOP ──
  function animate() {
    requestAnimationFrame(animate);

    if (isRolling) {
      ball.position.z += ballVZ;
      ball.position.x += ballVX;
      ball.rotation.x -= 0.15;

      // Ball - Pin Collisions
      pins.forEach(pin => {
        if (!pin.isDown) {
          const dist = Math.hypot(ball.position.x - pin.position.x, ball.position.z - pin.position.z);
          if (dist < 1.1) {
            pin.isDown = true;
            pin.vx = (pin.position.x - ball.position.x) * 0.5 + (Math.random() - 0.5) * 0.3;
            pin.vz = ballVZ * 0.4;
            pin.vRot = 0.2;
          }
        }
      });

      // Camera follow rolling ball
      camera.position.z = Math.max(-25, ball.position.z + 12);
      camera.position.y = 4;
      camera.lookAt(ball.position.x * 0.5, 1, ball.position.z - 20);

      // Reset when ball passes pit
      if (ball.position.z < PIN_START_Z - 10) {
        setTimeout(() => {
          let count = pins.filter(p => p.isDown).length;
          pinsDownEl.innerText = count;
          scoreEl.innerText = count === 10 ? 'STRIKE! 🎳' : `${count * 10}`;

          isRolling = false;
          ball.position.set(0, 0.7, 10);
          ballVX = 0;
          ballVZ = 0;
          camera.position.set(0, 5, 22);
          camera.lookAt(0, 1.5, -30);
          setTimeout(spawnPins, 1200);
        }, 800);
      }
    }

    // Animate falling pins
    pins.forEach(pin => {
      if (pin.isDown) {
        pin.position.x += pin.vx;
        pin.position.z += pin.vz;
        pin.rotation.z += pin.vRot;
        pin.rotation.x += pin.vRot * 0.7;
        pin.position.y = Math.max(0.3, pin.position.y - 0.05);
        pin.vx *= 0.95;
        pin.vz *= 0.95;
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
