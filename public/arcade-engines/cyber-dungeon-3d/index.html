<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Doom 3D: Demonic Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #05010a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #ef4444;
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(239,68,68,0.3);
    }
    .hud-title { font-size: 10px; font-weight: 900; color: #f87171; text-transform: uppercase; }
    .hud-val { font-size: 24px; font-weight: 900; color: #fca5a5; font-family: monospace; }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 28px;
      height: 28px;
      border: 2px solid rgba(239, 68, 68, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 4px; height: 4px;
      background: #ef4444;
      border-radius: 50%;
    }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #ef4444;
      color: #ef4444;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
    }
    .btn:active { background: #ef4444; color: #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Health / Armor</div>
      <div class="hud-val"><span id="health">100</span>%</div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div class="hud-title">Demons Purged</div>
      <div class="hud-val" id="score">0</div>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="controls">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
      <div class="btn" style="visibility: hidden;"></div>
      <div class="btn" id="btn-up">▲</div>
      <div class="btn" style="visibility: hidden;"></div>
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div class="btn" id="btn-fire" style="background: #ef4444; border-color: #ef4444; color: #fff; width: 90px; height: 90px; font-size: 32px;">🔥</div>
    </div>
  </div>
</div>

<script>
  // ── THREE.JS 3D FPS ARENA SETUP ──
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x1a0505, 0.018);

  const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.8, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // ── LIGHTING ──
  const ambient = new THREE.AmbientLight(0x450a0a, 1.5);
  scene.add(ambient);

  const redCoreLight = new THREE.PointLight(0xef4444, 3, 150);
  redCoreLight.position.set(0, 20, 0);
  scene.add(redCoreLight);

  // ── ARENA GEOMETRY ──
  const ARENA_SIZE = 120;
  const floorGeo = new THREE.PlaneGeometry(ARENA_SIZE, ARENA_SIZE);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1c1917, roughness: 0.8, metalness: 0.2 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Perimeter Lava Walls
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x450a0a, emissive: 0x2b0505, roughness: 0.5 });
  const wallGeoX = new THREE.BoxGeometry(ARENA_SIZE, 12, 2);
  const wallGeoZ = new THREE.BoxGeometry(2, 12, ARENA_SIZE);

  const northWall = new THREE.Mesh(wallGeoX, wallMat); northWall.position.set(0, 6, -ARENA_SIZE / 2);
  const southWall = new THREE.Mesh(wallGeoX, wallMat); southWall.position.set(0, 6, ARENA_SIZE / 2);
  const eastWall = new THREE.Mesh(wallGeoZ, wallMat); eastWall.position.set(ARENA_SIZE / 2, 6, 0);
  const westWall = new THREE.Mesh(wallGeoZ, wallMat); westWall.position.set(-ARENA_SIZE / 2, 6, 0);
  scene.add(northWall, southWall, eastWall, westWall);

  // Lava Pillars
  const pillarGeo = new THREE.CylinderGeometry(2, 2, 12, 16);
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, emissive: 0xef4444, emissiveIntensity: 0.2 });
  const pillarPositions = [
    [-25, 6, -25], [25, 6, -25],
    [-25, 6, 25], [25, 6, 25]
  ];
  pillarPositions.forEach(pos => {
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.position.set(...pos);
    scene.add(pillar);
  });

  // ── PLASMA CANNON (FIRST PERSON VIEW) ──
  const gunGroup = new THREE.Group();
  const barrelGeo = new THREE.CylinderGeometry(0.08, 0.1, 1.2, 16);
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.1 });
  const barrel = new THREE.Mesh(barrelGeo, barrelMat);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0.35, -0.3, -0.6);
  gunGroup.add(barrel);

  const coreGeo = new THREE.SphereGeometry(0.12, 16, 16);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
  const gunCore = new THREE.Mesh(coreGeo, coreMat);
  gunCore.position.set(0.35, -0.25, -0.8);
  gunGroup.add(gunCore);

  camera.add(gunGroup);
  scene.add(camera);

  // ── DEMONS / ENEMIES ──
  const demons = [];
  const demonGeo = new THREE.DodecahedronGeometry(1.5, 1);
  const demonMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x7f1d1d, roughness: 0.2 });

  function spawnDemon() {
    const demon = new THREE.Mesh(demonGeo, demonMat);
    const ang = Math.random() * Math.PI * 2;
    const dist = 25 + Math.random() * 30;
    demon.position.set(
      camera.position.x + Math.sin(ang) * dist,
      1.8,
      camera.position.z + Math.cos(ang) * dist
    );
    demon.hp = 2;
    demon.speed = 0.08 + Math.random() * 0.04;
    scene.add(demon);
    demons.push(demon);
  }

  for (let i = 0; i < 8; i++) spawnDemon();

  // ── PLASMA SHOTS ──
  const shots = [];
  const shotGeo = new THREE.SphereGeometry(0.3, 16, 16);
  const shotMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

  function fireWeapon() {
    const shot = new THREE.Mesh(shotGeo, shotMat);
    shot.position.copy(camera.position);
    
    // Shoot in camera view direction
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    shot.velocity = dir.multiplyScalar(2.2);

    scene.add(shot);
    shots.push(shot);

    // Gun recoil animation
    gunGroup.position.z += 0.15;
    setTimeout(() => { gunGroup.position.z = 0; }, 100);
  }

  // ── CONTROLS & STATE ──
  let health = 100;
  let score = 0;
  let moveSpeed = 0.4;
  let yaw = 0;
  let pitch = 0;
  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ') fireWeapon();
  });

  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  // Mouse look
  window.addEventListener('mousemove', e => {
    if (document.pointerLockElement === renderer.domElement || e.buttons > 0) {
      yaw -= e.movementX * 0.003;
      pitch = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch - e.movementY * 0.003));
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
    }
  });

  renderer.domElement.addEventListener('click', () => {
    renderer.domElement.requestPointerLock?.();
  });

  const bindTouch = (id, action) => {
    const el = document.getElementById(id);
    if (action === 'fire') {
      el.addEventListener('pointerdown', e => { e.preventDefault(); fireWeapon(); });
    } else {
      el.addEventListener('pointerdown', e => { e.preventDefault(); keys[action] = true; });
      el.addEventListener('pointerup', e => { e.preventDefault(); keys[action] = false; });
      el.addEventListener('pointerleave', e => { e.preventDefault(); keys[action] = false; });
    }
  };
  bindTouch('btn-up', 'up');
  bindTouch('btn-down', 'down');
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-fire', 'fire');

  const healthEl = document.getElementById('health');
  const scoreEl = document.getElementById('score');

  // ── GAME LOOP ──
  function animate() {
    requestAnimationFrame(animate);

    // Player Movement relative to Camera Angle
    const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
    const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

    if (keys.up) camera.position.addScaledVector(forward, moveSpeed);
    if (keys.down) camera.position.addScaledVector(forward, -moveSpeed);
    if (keys.left) camera.position.addScaledVector(right, -moveSpeed);
    if (keys.right) camera.position.addScaledVector(right, moveSpeed);

    // Bound in Arena
    const limit = ARENA_SIZE / 2 - 3;
    camera.position.x = Math.max(-limit, Math.min(limit, camera.position.x));
    camera.position.z = Math.max(-limit, Math.min(limit, camera.position.z));
    camera.position.y = 1.8;

    // Update Shots
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.position.add(s.velocity);

      // Shot - Demon Collision
      for (let j = demons.length - 1; j >= 0; j--) {
        const d = demons[j];
        if (s.position.distanceTo(d.position) < 2) {
          d.hp--;
          scene.remove(s);
          shots.splice(i, 1);

          if (d.hp <= 0) {
            scene.remove(d);
            demons.splice(j, 1);
            score += 100;
            scoreEl.innerText = score.toLocaleString();
            spawnDemon();
          }
          break;
        }
      }

      // Despawn shot out of bounds
      if (s && Math.hypot(s.position.x, s.position.z) > ARENA_SIZE) {
        scene.remove(s);
        shots.splice(i, 1);
      }
    }

    // Update Demons (Chase player)
    demons.forEach(d => {
      d.rotation.y += 0.03;
      d.rotation.x += 0.02;

      const dir = new THREE.Vector3().subVectors(camera.position, d.position).normalize();
      d.position.x += dir.x * d.speed;
      d.position.z += dir.z * d.speed;

      // Hit Player
      if (d.position.distanceTo(camera.position) < 2) {
        health = Math.max(0, health - 0.5);
        healthEl.innerText = Math.round(health);

        if (health <= 0) {
          alert(`SLAYER DOWN! Score: ${score}`);
          health = 100;
          score = 0;
          healthEl.innerText = '100';
          scoreEl.innerText = '0';
          camera.position.set(0, 1.8, 0);
        }
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
