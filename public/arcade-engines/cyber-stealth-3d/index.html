<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Stealth 3D: Infiltration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #050814;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #06b6d4;
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 15px rgba(6,182,212,0.3);
    }
    .hud-title { font-size: 10px; font-weight: 900; color: #38bdf8; text-transform: uppercase; }
    .hud-val { font-size: 24px; font-weight: 900; color: #a5f3fc; font-family: monospace; }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #06b6d4;
      color: #06b6d4;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
    }
    .btn:active { background: #06b6d4; color: #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Stealth Index</div>
      <div class="hud-val" style="color: #4ade80;"><span id="stealth">100</span>%</div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div class="hud-title">Data Terminals Hacked</div>
      <div class="hud-val" id="score">0</div>
    </div>
  </div>

  <div id="controls">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
      <div class="btn" style="visibility: hidden;"></div>
      <div class="btn" id="btn-up">▲</div>
      <div class="btn" style="visibility: hidden;"></div>
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-down">▼</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px;">
      <div class="btn" id="btn-hack" style="background: #06b6d4; border-color: #06b6d4; color: #000; width: 90px; height: 90px; font-size: 30px;">💻</div>
    </div>
  </div>
</div>

<script>
  // ── THREE.JS 3D SCENE SETUP ──
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050814, 0.015);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 30, 25);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // ── LIGHTING ──
  const ambient = new THREE.AmbientLight(0x0a192f, 2);
  scene.add(ambient);

  const mainLight = new THREE.PointLight(0x06b6d4, 2, 100);
  mainLight.position.set(0, 25, 0);
  scene.add(mainLight);

  // ── 3D CYBER INFILTRATION FACILITY ──
  const floorGeo = new THREE.PlaneGeometry(100, 100);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  // Grid
  const grid = new THREE.GridHelper(100, 20, 0x06b6d4, 0x1e293b);
  scene.add(grid);

  // ── STEALTH OPERATIVE (HERO) ──
  const hero = new THREE.Group();
  const bodyGeo = new THREE.CapsuleGeometry(0.8, 1.2, 8, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.9, roughness: 0.1 });
  const heroMesh = new THREE.Mesh(bodyGeo, bodyMat);
  heroMesh.position.y = 1.4;
  hero.add(heroMesh);
  scene.add(hero);

  // ── PATROL DRONES ──
  const drones = [];
  const droneGeo = new THREE.OctahedronGeometry(1.2);
  const droneMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b });

  for (let i = 0; i < 4; i++) {
    const drone = new THREE.Mesh(droneGeo, droneMat);
    drone.radius = 15 + i * 8;
    drone.angle = (i * Math.PI) / 2;
    drone.speed = 0.02 + i * 0.005;
    drone.position.set(Math.cos(drone.angle) * drone.radius, 2.5, Math.sin(drone.angle) * drone.radius);
    scene.add(drone);
    drones.push(drone);
  }

  // ── DATA TERMINALS ──
  const terminals = [];
  const termGeo = new THREE.BoxGeometry(2, 3, 2);
  const termMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x047857 });

  const termPositions = [
    [-25, 1.5, -25], [25, 1.5, -25],
    [-25, 1.5, 25], [25, 1.5, 25],
    [0, 1.5, -35], [0, 1.5, 35]
  ];

  termPositions.forEach(pos => {
    const term = new THREE.Mesh(termGeo, termMat);
    term.position.set(...pos);
    term.hacked = false;
    scene.add(term);
    terminals.push(term);
  });

  // ── CONTROLS & STATE ──
  let stealth = 100;
  let score = 0;
  let moveSpeed = 0.4;
  const keys = { up: false, down: false, left: false, right: false };

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ' || e.key === 'e') tryHack();
  });

  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  const bindTouch = (id, action) => {
    const el = document.getElementById(id);
    if (action === 'hack') {
      el.addEventListener('pointerdown', e => { e.preventDefault(); tryHack(); });
    } else {
      el.addEventListener('pointerdown', e => { e.preventDefault(); keys[action] = true; });
      el.addEventListener('pointerup', e => { e.preventDefault(); keys[action] = false; });
      el.addEventListener('pointerleave', e => { e.preventDefault(); keys[action] = false; });
    }
  };
  bindTouch('btn-up', 'up');
  bindTouch('btn-down', 'down');
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-hack', 'hack');

  const stealthEl = document.getElementById('stealth');
  const scoreEl = document.getElementById('score');

  function tryHack() {
    terminals.forEach(t => {
      if (!t.hacked && hero.position.distanceTo(t.position) < 4.5) {
        t.hacked = true;
        t.material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, emissive: 0x1d4ed8 });
        score++;
        scoreEl.innerText = score;
      }
    });
  }

  // ── GAME LOOP ──
  function animate() {
    requestAnimationFrame(animate);

    // Hero Movement
    if (keys.up) hero.position.z -= moveSpeed;
    if (keys.down) hero.position.z += moveSpeed;
    if (keys.left) hero.position.x -= moveSpeed;
    if (keys.right) hero.position.x += moveSpeed;

    // Bounds
    hero.position.x = Math.max(-45, Math.min(45, hero.position.x));
    hero.position.z = Math.max(-45, Math.min(45, hero.position.z));

    // Camera Top-Down Tracking
    camera.position.x += (hero.position.x - camera.position.x) * 0.1;
    camera.position.z += (hero.position.z + 28 - camera.position.z) * 0.1;
    camera.lookAt(hero.position.x, 0, hero.position.z);

    // Drone Patrols & Detection
    drones.forEach(d => {
      d.angle += d.speed;
      d.position.x = Math.cos(d.angle) * d.radius;
      d.position.z = Math.sin(d.angle) * d.radius;
      d.rotation.y += 0.05;

      // Detection
      const dist = hero.position.distanceTo(d.position);
      if (dist < 6) {
        stealth = Math.max(0, stealth - 1.2);
        stealthEl.innerText = Math.round(stealth);

        if (stealth <= 0) {
          alert(`DETECTED BY SCANNER! Terminals Hacked: ${score}`);
          stealth = 100;
          score = 0;
          stealthEl.innerText = '100';
          scoreEl.innerText = '0';
          hero.position.set(0, 0, 0);
          terminals.forEach(t => {
            t.hacked = false;
            t.material = termMat;
          });
        }
      }
    });

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
