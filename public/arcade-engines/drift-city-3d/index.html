<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Drift Horizon 3D: Cyber City</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud-title { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .hud-val { font-size: 24px; font-weight: 900; color: #38bdf8; font-family: monospace; }
    #drift-meter {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #ec4899;
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 900;
      color: #ec4899;
      box-shadow: 0 0 20px rgba(236,72,153,0.4);
      display: none;
      pointer-events: none;
      z-index: 10;
    }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
    }
    .btn:active { background: #38bdf8; color: #000; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Speed</div>
      <div class="hud-val"><span id="speed">0</span> <span style="font-size: 12px;">KM/H</span></div>
    </div>
    <div class="hud-card" style="text-align: right;">
      <div class="hud-title">Drift Score</div>
      <div class="hud-val" style="color: #ec4899;" id="score">0</div>
    </div>
  </div>

  <div id="drift-meter">🔥 DRIFT x<span id="drift-mult">1.0</span></div>

  <div id="controls">
    <div style="display: flex; gap: 12px;">
      <div class="btn" id="btn-left">◀</div>
      <div class="btn" id="btn-right">▶</div>
    </div>
    <div style="display: flex; gap: 12px;">
      <div class="btn" id="btn-brake" style="border-color: #ef4444; color: #ef4444;">🛑</div>
      <div class="btn" id="btn-gas" style="border-color: #22c55e; color: #22c55e;">⚡</div>
    </div>
  </div>
</div>

<script>
  // ── THREE.JS 3D SCENE SETUP ──
  const container = document.getElementById('game-container');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050814, 0.015);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // ── LIGHTING ──
  const ambient = new THREE.AmbientLight(0x223355, 1.2);
  scene.add(ambient);

  const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.5);
  dirLight.position.set(50, 80, 50);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // ── ENVIRONMENT: NEON CITY SKYLINE & TRACK ──
  const groundGeo = new THREE.PlaneGeometry(1000, 1000, 32, 32);
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.8, metalness: 0.2 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid lines
  const gridHelper = new THREE.GridHelper(1000, 100, 0x1e293b, 0x0f172a);
  scene.add(gridHelper);

  // Road Track
  const trackCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.1, 0),
    new THREE.Vector3(100, 0.1, 80),
    new THREE.Vector3(200, 0.1, 0),
    new THREE.Vector3(180, 0.1, -150),
    new THREE.Vector3(0, 0.1, -220),
    new THREE.Vector3(-160, 0.1, -120),
    new THREE.Vector3(-120, 0.1, 40)
  ], true);

  const trackGeo = new THREE.TubeGeometry(trackCurve, 120, 12, 8, true);
  const trackMat = new THREE.MeshStandardMaterial({ color: 0x182030, roughness: 0.6 });
  const track = new THREE.Mesh(trackGeo, trackMat);
  track.scale.set(1, 0.05, 1);
  scene.add(track);

  // Neon Buildings
  const buildings = [];
  const bldgColors = [0x0ea5e9, 0xec4899, 0x8b5cf6, 0x10b981];
  for (let i = 0; i < 90; i++) {
    const h = 40 + Math.random() * 120;
    const w = 15 + Math.random() * 25;
    const bGeo = new THREE.BoxGeometry(w, h, w);
    const bColor = bldgColors[Math.floor(Math.random() * bldgColors.length)];
    const bMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      emissive: bColor,
      emissiveIntensity: 0.15,
      roughness: 0.3
    });
    const bldg = new THREE.Mesh(bGeo, bMat);
    const ang = Math.random() * Math.PI * 2;
    const dist = 140 + Math.random() * 250;
    bldg.position.set(Math.cos(ang) * dist, h / 2, Math.sin(ang) * dist);
    scene.add(bldg);
    buildings.push(bldg);
  }

  // ── 3D CYBER DRIFT CAR ──
  const carGroup = new THREE.Group();

  // Car Body
  const bodyGeo = new THREE.BoxGeometry(2.4, 0.8, 5);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x06b6d4, metalness: 0.85, roughness: 0.15 });
  const carBody = new THREE.Mesh(bodyGeo, bodyMat);
  carBody.position.y = 0.7;
  carBody.castShadow = true;
  carGroup.add(carBody);

  // Cabin
  const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.5);
  const cabinMat = new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.1, metalness: 0.9 });
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(0, 1.3, -0.3);
  carGroup.add(cabin);

  // Headlights
  const lightGeo = new THREE.BoxGeometry(0.5, 0.2, 0.2);
  const lightMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const leftLight = new THREE.Mesh(lightGeo, lightMat);
  leftLight.position.set(-0.8, 0.7, 2.5);
  const rightLight = new THREE.Mesh(lightGeo, lightMat);
  rightLight.position.set(0.8, 0.7, 2.5);
  carGroup.add(leftLight, rightLight);

  // Taillights
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
  const tailLight = new THREE.Mesh(new THREE.BoxGeometry(2, 0.15, 0.1), tailMat);
  tailLight.position.set(0, 0.75, -2.5);
  carGroup.add(tailLight);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.4, 16);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
  const wheelPositions = [
    [-1.2, 0.45, 1.5], [1.2, 0.45, 1.5],
    [-1.2, 0.45, -1.5], [1.2, 0.45, -1.5]
  ];
  wheelPositions.forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(...pos);
    carGroup.add(wheel);
  });

  scene.add(carGroup);

  // ── PHYSICS & DRIFT LOGIC ──
  let speed = 0;
  let maxSpeed = 160;
  let accel = 0.8;
  let steer = 0;
  let carHeading = 0;
  let driftAngle = 0;
  let totalDriftScore = 0;
  let driftMultiplier = 1;
  let isDrifting = false;

  const keys = { gas: false, brake: false, left: false, right: false };

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
    if (e.key === 'ArrowDown' || e.key === 's') keys.brake = true;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  });

  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
    if (e.key === 'ArrowDown' || e.key === 's') keys.brake = false;
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  // Touch controls
  const bindTouch = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('pointerup', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('pointerleave', e => { e.preventDefault(); keys[key] = false; });
  };
  bindTouch('btn-gas', 'gas');
  bindTouch('btn-brake', 'brake');
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');

  const speedEl = document.getElementById('speed');
  const scoreEl = document.getElementById('score');
  const driftMeterEl = document.getElementById('drift-meter');
  const driftMultEl = document.getElementById('drift-mult');

  // ── GAME LOOP ──
  function animate() {
    requestAnimationFrame(animate);

    // Acceleration & Braking
    if (keys.gas) speed = Math.min(maxSpeed, speed + accel);
    else if (keys.brake) speed = Math.max(-30, speed - accel * 1.5);
    else speed *= 0.97; // natural drag

    // Steering
    const steerSpeed = 0.04;
    if (keys.left) steer = Math.max(-0.6, steer - steerSpeed);
    else if (keys.right) steer = Math.min(0.6, steer + steerSpeed);
    else steer *= 0.8;

    // Drift calculation
    if (Math.abs(steer) > 0.3 && speed > 50) {
      isDrifting = true;
      driftAngle = steer * 1.4;
      driftMultiplier = Math.min(5, driftMultiplier + 0.02);
      totalDriftScore += Math.floor(speed * 0.1 * driftMultiplier);
      driftMeterEl.style.display = 'block';
      driftMultEl.innerText = driftMultiplier.toFixed(1);
    } else {
      isDrifting = false;
      driftAngle *= 0.85;
      driftMultiplier = 1;
      driftMeterEl.style.display = 'none';
    }

    carHeading += steer * (speed / maxSpeed) * 0.05;

    // Move Car
    const moveDist = (speed / 3.6) * 0.016;
    carGroup.position.x += Math.sin(carHeading) * moveDist;
    carGroup.position.z += Math.cos(carHeading) * moveDist;

    // Rotate Car with Drift Angle
    carGroup.rotation.y = carHeading + driftAngle;

    // Smooth Third-Person Camera Follow
    const camDist = 12;
    const camHeight = 5;
    const targetCamX = carGroup.position.x - Math.sin(carHeading) * camDist;
    const targetCamZ = carGroup.position.z - Math.cos(carHeading) * camDist;

    camera.position.x += (targetCamX - camera.position.x) * 0.1;
    camera.position.z += (targetCamZ - camera.position.z) * 0.1;
    camera.position.y += (carGroup.position.y + camHeight - camera.position.y) * 0.1;
    camera.lookAt(carGroup.position.x, carGroup.position.y + 1.2, carGroup.position.z);

    // Update HUD
    speedEl.innerText = Math.abs(Math.round(speed));
    scoreEl.innerText = totalDriftScore.toLocaleString();

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
