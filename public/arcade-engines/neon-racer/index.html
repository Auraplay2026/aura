<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Horizon 3D Turbo Racer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #090a10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 600px;
      max-height: 800px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,255,200,0.2);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #05050d;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-family: monospace;
      font-weight: 900;
      font-size: 16px;
      text-shadow: 0 0 10px #00ffcc;
      z-index: 10;
    }
    #touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }
    .btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(0,255,200,0.5);
      color: #00ffcc;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      backdrop-filter: blur(5px);
    }
    .btn:active { background: rgba(0,255,200,0.4); }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5,5,15,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      backdrop-filter: blur(8px);
    }
    #start-btn {
      margin-top: 20px;
      padding: 14px 36px;
      background: linear-gradient(90deg, #ff007f, #00ffcc);
      border: none;
      border-radius: 30px;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,200,0.6);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score-val">0</span></div>
    <div>SPEED: <span id="speed-val">120</span> KM/H</div>
  </div>

  <canvas id="canvas"></canvas>

  <div id="touch-controls">
    <div class="btn" id="left-btn">◀</div>
    <div class="btn" id="boost-btn">⚡</div>
    <div class="btn" id="right-btn">▶</div>
  </div>

  <div id="overlay">
    <h1 style="font-size: 28px; font-weight: 900; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; letter-spacing: 2px;">NEON TURBO RACER</h1>
    <p style="font-size: 12px; color: #aaa; margin-top: 6px;">DODGE TRAFFIC • COLLECT NITRO</p>
    <button id="start-btn">START RACE</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');
  const scoreVal = document.getElementById('score-val');
  const speedVal = document.getElementById('speed-val');

  let width, height;
  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let isPlaying = false;
  let score = 0;
  let speed = 120;
  let playerX = 0; // -1 to 1
  let playerY = 0;
  let roadOffset = 0;
  let keys = { left: false, right: false, boost: false };
  let traffic = [];
  let particles = [];

  function spawnTraffic() {
    if (Math.random() < 0.035) {
      traffic.push({
        x: (Math.random() - 0.5) * 1.5,
        y: 0,
        speed: 0.008 + Math.random() * 0.008,
        color: ['#ff0055', '#ffaa00', '#aa00ff', '#00aaff'][Math.floor(Math.random() * 4)]
      });
    }
  }

  function startGame() {
    score = 0;
    speed = 120;
    playerX = 0;
    traffic = [];
    particles = [];
    isPlaying = true;
    overlay.style.display = 'none';
    requestAnimationFrame(gameLoop);
  }

  startBtn.addEventListener('click', startGame);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.boost = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.boost = false;
  });

  const leftBtn = document.getElementById('left-btn');
  const rightBtn = document.getElementById('right-btn');
  const boostBtn = document.getElementById('boost-btn');

  leftBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
  leftBtn.addEventListener('touchend', e => { e.preventDefault(); keys.left = false; });
  rightBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.right = true; });
  rightBtn.addEventListener('touchend', e => { e.preventDefault(); keys.right = false; });
  boostBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.boost = true; });
  boostBtn.addEventListener('touchend', e => { e.preventDefault(); keys.boost = false; });

  function gameOver() {
    isPlaying = false;
    overlay.innerHTML = `
      <h1 style="font-size: 28px; font-weight: 900; color: #ff0055; text-shadow: 0 0 20px #ff0055;">CRASHED!</h1>
      <p style="font-size: 16px; color: #fff; margin-top: 10px;">FINAL SCORE: ${Math.floor(score)}</p>
      <button id="start-btn" onclick="startGame()">RETRY</button>
    `;
    overlay.style.display = 'flex';
  }

  function gameLoop() {
    if (!isPlaying) return;

    // Updates
    const currentSpeed = keys.boost ? 220 : 140;
    speed = speed + (currentSpeed - speed) * 0.05;
    speedVal.innerText = Math.round(speed);

    score += (speed / 60);
    scoreVal.innerText = Math.floor(score);

    if (keys.left) playerX = Math.max(-0.85, playerX - 0.04);
    if (keys.right) playerX = Math.min(0.85, playerX + 0.04);

    roadOffset = (roadOffset + speed * 0.001) % 1;

    spawnTraffic();

    // Render 3D Perspective Road
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);

    // Horizon line
    const horizon = height * 0.35;

    // Draw Cyberpunk Grid Sky
    const grad = ctx.createLinearGradient(0, 0, 0, horizon);
    grad.addColorStop(0, '#100028');
    grad.addColorStop(1, '#050510');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, horizon);

    // Glowing Sun
    ctx.fillStyle = '#ff007f';
    ctx.shadowColor = '#ff007f';
    ctx.shadowBlur = 30;
    ctx.beginPath();
    ctx.arc(width * 0.5, horizon - 20, 45, Math.PI, 0, false);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Draw Perspective Road Lines
    ctx.fillStyle = '#0a0a1a';
    ctx.beginPath();
    ctx.moveTo(width * 0.45, horizon);
    ctx.lineTo(width * 0.55, horizon);
    ctx.lineTo(width * 0.95, height);
    ctx.lineTo(width * 0.05, height);
    ctx.fill();

    // Neon Road Edges
    ctx.strokeStyle = '#00ffcc';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(width * 0.45, horizon);
    ctx.lineTo(width * 0.05, height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(width * 0.55, horizon);
    ctx.lineTo(width * 0.95, height);
    ctx.stroke();

    // Center Dashed Stripes
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    for (let i = 0; i < 15; i++) {
      let p = (i / 15 + roadOffset) % 1;
      let y = horizon + Math.pow(p, 2) * (height - horizon);
      let nextY = horizon + Math.pow(Math.min(1, p + 0.03), 2) * (height - horizon);
      ctx.beginPath();
      ctx.moveTo(width * 0.5, y);
      ctx.lineTo(width * 0.5, nextY);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Draw Traffic Cars
    for (let i = traffic.length - 1; i >= 0; i--) {
      const car = traffic[i];
      car.y += car.speed * (speed / 100);

      const y = horizon + Math.pow(car.y, 2) * (height - horizon);
      const roadW = width * (0.1 + car.y * 0.85);
      const x = width * 0.5 + car.x * (roadW * 0.5);
      const scale = 0.2 + car.y * 0.8;
      const carW = 35 * scale;
      const carH = 22 * scale;

      ctx.fillStyle = car.color;
      ctx.shadowColor = car.color;
      ctx.shadowBlur = 10;
      ctx.fillRect(x - carW / 2, y - carH, carW, carH);
      ctx.shadowBlur = 0;

      // Tail lights
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(x - carW * 0.4, y - 4, 4 * scale, 3 * scale);
      ctx.fillRect(x + carW * 0.4 - 4 * scale, y - 4, 4 * scale, 3 * scale);

      // Collision Detection with Player
      if (car.y > 0.82 && car.y < 0.96 && Math.abs(playerX - car.x) < 0.22) {
        gameOver();
        return;
      }

      if (car.y > 1.1) traffic.splice(i, 1);
    }

    // Draw Player Hypercar (Bottom Center)
    const pY = height * 0.88;
    const pX = width * 0.5 + playerX * (width * 0.4);

    ctx.fillStyle = '#00ffcc';
    ctx.shadowColor = '#00ffcc';
    ctx.shadowBlur = 15;
    // Car Body
    ctx.beginPath();
    ctx.roundRect(pX - 25, pY - 20, 50, 32, 6);
    ctx.fill();

    // Windshield
    ctx.fillStyle = '#002233';
    ctx.fillRect(pX - 18, pY - 14, 36, 12);

    // Neon Glow Exhaust (Nitro flames when boosting)
    if (keys.boost) {
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.fillRect(pX - 18, pY + 12, 10, 15 + Math.random() * 10);
      ctx.fillRect(pX + 8, pY + 12, 10, 15 + Math.random() * 10);
    }
    ctx.shadowBlur = 0;

    requestAnimationFrame(gameLoop);
  }
</script>
</body>
</html>
