<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Fruit Katana Slicer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1c1917;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    #game-box {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 500px;
      max-height: 750px;
      background: #292524;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-weight: 900;
      font-size: 18px;
      color: #f97316;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="game-box">
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
  </div>
  <canvas id="canvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  let width, height;
  function resize() {
    width = canvas.width = canvas.parentElement.clientWidth;
    height = canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let fruits = [];
  let particles = [];
  let bladeTrail = [];
  let score = 0;
  let lives = 3;
  let gameOver = false;

  const FRUIT_TYPES = [
    { name: 'watermelon', color: '#16a34a', juice: '#dc2626', rad: 28 },
    { name: 'orange', color: '#ea580c', juice: '#fb923c', rad: 22 },
    { name: 'apple', color: '#dc2626', juice: '#f87171', rad: 20 },
    { name: 'banana', color: '#facc15', juice: '#fef08a', rad: 18 }
  ];

  function spawnFruit() {
    if (Math.random() < 0.035) {
      const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
      fruits.push({
        x: 60 + Math.random() * (width - 120),
        y: height + 30,
        vx: (Math.random() - 0.5) * 6,
        vy: -14 - Math.random() * 5,
        type: type,
        sliced: false
      });
    }
  }

  function addBladePoint(x, y) {
    bladeTrail.push({ x, y, time: Date.now() });

    // Check slice collision
    for (const f of fruits) {
      if (!f.sliced) {
        const dist = Math.hypot(f.x - x, f.y - y);
        if (dist < f.type.rad) {
          f.sliced = true;
          score += 10;
          scoreEl.innerText = score;

          // Spawn Juice Splats
          for (let i = 0; i < 15; i++) {
            particles.push({
              x: f.x,
              y: f.y,
              vx: (Math.random() - 0.5) * 8,
              vy: (Math.random() - 0.5) * 8,
              color: f.type.juice,
              rad: 3 + Math.random() * 4,
              life: 1
            });
          }
        }
      }
    }
  }

  window.addEventListener('mousemove', e => {
    if (e.buttons > 0) {
      const rect = canvas.getBoundingClientRect();
      addBladePoint(e.clientX - rect.left, e.clientY - rect.top);
    }
  });

  window.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < e.touches.length; i++) {
      addBladePoint(e.touches[i].clientX - rect.left, e.touches[i].clientY - rect.top);
    }
  }, { passive: false });

  function loop() {
    ctx.fillStyle = '#292524';
    ctx.fillRect(0, 0, width, height);

    spawnFruit();

    // Update Fruits
    for (let i = fruits.length - 1; i >= 0; i--) {
      const f = fruits[i];
      f.vy += 0.35; // Gravity
      f.x += f.vx;
      f.y += f.vy;

      if (!f.sliced) {
        ctx.fillStyle = f.type.color;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.type.rad, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      if (f.y > height + 50) {
        if (!f.sliced) {
          lives--;
          livesEl.innerText = lives;
          if (lives <= 0) {
            alert(`GAME OVER! Score: ${score}`);
            lives = 3; score = 0;
            scoreEl.innerText = '0'; livesEl.innerText = '3';
            fruits = [];
          }
        }
        fruits.splice(i, 1);
      }
    }

    // Update Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;

      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (p.life <= 0) particles.splice(i, 1);
    }

    // Draw Blade Trail
    const now = Date.now();
    bladeTrail = bladeTrail.filter(pt => now - pt.time < 120);

    if (bladeTrail.length > 1) {
      ctx.strokeStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
      for (let i = 1; i < bladeTrail.length; i++) {
        ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
