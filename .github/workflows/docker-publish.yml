name: Build, Publish & Deploy Container

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Database Migration
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install DB Dependencies & Execute Clean Slate Purge
        env:
          DATABASE_URL: "postgresql://postgres.ipzqtmbxzoooimbcowcm:Siddiqui%40009@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres"
          ADMIN_DEFAULT_PASSWORD: "AuraBetAdmin2026!"
        run: |
          npm install --no-audit --prefer-offline pg @prisma/client @prisma/adapter-pg bcryptjs dotenv
          npx prisma generate
          node scripts/reset-clean-slate.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/$REPO_LOWER/aura" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v1.0.0
            ${{ env.IMAGE_NAME }}:v1.0
            ${{ env.IMAGE_NAME }}:v1
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy and Rollout to OpenShift
        if: success()
        env:
          OPENSHIFT_SERVER: https://api.rm2.thpm.p1.openshiftapps.com:6443
          OPENSHIFT_TOKEN: eyJhbGciOiJSUzI1NiIsImtpZCI6Ik44bmJtRDBQX3AwVG9JMm1rSVZBZUNScHdjbVRfUzM3cGR3RXJwZnFibjQifQ..UhJVZ-d89qYqrbIUbtXyyEGsOPJMwm8cIeJy1-SSdoJLUP5wOlLuWizrEXQ7MNavKZjoIKyChX4lj8_lpEjU9u3oTFTzGmeFa7tFdf34XOqVUPl6klC30lKc-k80PBRPrFPFpO3Yb1GjiFR3OzcneddLnGEL2luBpcSioSGBhsPLsKW8fJdOCYESzEgmsHPBvJ-XxglowRSoqNHHvpVJHjC1FExab2NHGUga39KEkJbeIFo3XEjrLP00uA3fZS_9d0m2aiwMoSCUvLJcEVbh1TLJ3ygratQf514hkpX2jSCPGOIzz8nl7Jae4J8d7SEZFJQVlm7q9GjS9cPqMfbfsQqP8KOcy_BUe9NQotVfD5H0wINWr-Kv2dpTTTM15TRhUCdCC9irNOrhJVePwf5b4xieRB2U9KO_k75cWqMkGFwjAwBQwY5r1E2BM-H4XGdwlLlJeaEu45vtzk0SQi3eLbCznWAf4zYjbwSaaY6exRwzjSVKCg6GV3QpNwluxk5Gsadtgjf15w3alf_11dKw_grxw-Na1afyNgUIDcYqlVeTvPIDhHQJ5-LbPKzFZ3N8Zao4cU8g6S-1g4-5hkg5Tj_o5N0qJ4p3k1VBoEnxrZjrItkJFKRRF9pBzrXW-7BZOgnSt_VGMs_slWrbwU-NgpVSm8d50Hq4BAabb9u7R0g
          OPENSHIFT_NAMESPACE: bluesignal5-dev
        run: |
          echo "🚀 Installing oc CLI..."
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          chmod +x oc

          echo "🔐 Logging into OpenShift Cluster ($OPENSHIFT_SERVER)..."
          ./oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

          echo "📋 Applying OpenShift configuration..."
          ./oc apply -f openshift-deployment.yaml -n "$OPENSHIFT_NAMESPACE"

          echo "🔄 Triggering Deployment Rollout Restart..."
          ./oc rollout restart deployment/auraplay-web -n "$OPENSHIFT_NAMESPACE" || true

          echo "⏳ Waiting for Rollout to Complete..."
          ./oc rollout status deployment/auraplay-web -n "$OPENSHIFT_NAMESPACE" --timeout=180s

          echo "🩺 Validating Health Endpoint..."
          sleep 5
          HEALTH_URL="https://auraplay-route-$OPENSHIFT_NAMESPACE.apps.rm2.thpm.p1.openshiftapps.com/api/health"
          curl -k -fsSL --max-time 15 "$HEALTH_URL"

          echo "✅ Production Deployment & Rollout Complete!"
