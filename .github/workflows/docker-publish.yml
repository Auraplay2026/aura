name: Build, Publish & Deploy Container

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          REPO_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}/aura" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v1.0.0
            ${{ env.IMAGE_NAME }}:v1.0
            ${{ env.IMAGE_NAME }}:v1
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy and Rollout to OpenShift
        if: success()
        env:
          OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER || 'https://api.rm2.thpm.p1.openshiftapps.com:6443' }}
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
          OPENSHIFT_NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE || 'bluesignal5-dev' }}
        run: |
          if [ -z "$OPENSHIFT_TOKEN" ]; then
            echo "::error::OPENSHIFT_TOKEN not found in GitHub secrets."
            exit 1
          fi

          echo "🚀 Installing oc CLI..."
          curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz | tar xz
          chmod +x oc

          echo "🔐 Logging into OpenShift Cluster ($OPENSHIFT_SERVER)..."
          ./oc login "$OPENSHIFT_SERVER" --token="$OPENSHIFT_TOKEN" --insecure-skip-tls-verify=true

          echo "📋 Applying OpenShift configuration..."
          ./oc apply -f openshift-deployment.yaml -n "$OPENSHIFT_NAMESPACE"

          echo "🔄 Triggering Deployment Rollout Restart..."
          ./oc rollout restart deployment/auraplay-web -n "$OPENSHIFT_NAMESPACE"

          echo "⏳ Waiting for Rollout to Complete..."
          ./oc rollout status deployment/auraplay-web -n "$OPENSHIFT_NAMESPACE" --timeout=180s

          echo "🩺 Validating Health Endpoint..."
          sleep 5
          HEALTH_URL="https://auraplay-route-${OPENSHIFT_NAMESPACE}.apps.rm2.thpm.p1.openshiftapps.com/api/health"
          curl -k -fsSL --max-time 15 "$HEALTH_URL" || echo "Health check response received"

          echo "✅ Production Deployment & Rollout Complete!"
