apiVersion: v1
kind: Namespace
metadata:
  name: auraplay-production
---
apiVersion: v1
kind: Secret
metadata:
  name: auraplay-secrets
  namespace: auraplay-production
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@localhost:5432/aura"
  JWT_SECRET: "placeholder-jwt-secret-replace-in-production"
  NEXTAUTH_SECRET: "placeholder-nextauth-secret-replace-in-production"
  ADMIN_DEFAULT_PASSWORD: "placeholder-admin-password"
  ADMIN_SECURITY_KEY: "placeholder-admin-key"
  MASTER_SECURITY_KEY: "placeholder-master-key"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auraplay-config
  namespace: auraplay-production
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NODE_OPTIONS: "--max-old-space-size=1024"
  ADMIN_EMAIL: "auraplay2026@gmail.com"
  NEXT_PUBLIC_APP_URL: "https://auraplay.apps.your-cluster.openshift.com"
  NEXT_PUBLIC_WHATSAPP_SUPPORT_NUMBER: "+1 (659) 221-0661"
  ENABLE_HSTS: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auraplay-web
  namespace: bluesignal5-dev
  labels:
    app: auraplay-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auraplay-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: auraplay-web
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-08-22T15:41:00Z"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auraplay-app
          image: ghcr.io/auraplay2026/aura:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: auraplay-config
            - secretRef:
                name: auraplay-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: auraplay-service
  namespace: auraplay-production
  labels:
    app: auraplay-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: auraplay-web
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: auraplay-route
  namespace: auraplay-production
  labels:
    app: auraplay-web
spec:
  to:
    kind: Service
    name: auraplay-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auraplay-network-policy
  namespace: auraplay-production
spec:
  podSelector:
    matchLabels:
      app: auraplay-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}
